name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

env:
  DATABASE_URL: "postgres://postgres:postgres@localhost:5432/rails_test"
  KEYCLOAKADMIN_SERVER_URL: foo
  KEYCLOAKADMIN_SERVER_DOMAIN: foo
  KEYCLOAKADMIN_CLIENT_REALM_NAME: foo
  KEYCLOAKADMIN_CLIENT_ID: foo
  KEYCLOAKADMIN_CLIENT_SECRET: foo
  RAILS_ENV: test
  RUBYOPT: "-W:no-deprecated -W:no-experimental"

jobs:
  rubocop:
    if: github.event.pull_request.draft == false

    runs-on: ubuntu-latest
    steps:
      - name: "Checkout code"
        uses: actions/checkout@v7.0.1

      - name: "Setup"
        uses: ./.github/actions/setup

      - name: "Run Rubocop"
        env:
          RAILS_ENV: development
        run: |
          bin/rubocop --format github

  rspec:
    if: github.event.pull_request.draft == false

    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18.3-alpine
        ports: ["5432:5432"]
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rails_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis
        ports: ["6379:6379"]
        options: --entrypoint redis-server

    steps:
      - name: "Checkout code"
        uses: actions/checkout@v7.0.1

      - name: "Setup"
        uses: ./.github/actions/setup

      - name: "Run API specs"
        env:
          RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
        run: |
          bin/rspec --tag ~skip_ci
